radius:
  address: 10.216.40.3
  secret: fXJnutML8N
  service: login

settings:
  runtime:
    workers: 100
    ssh_port: 22
    connect_timeout: 2
    auth_timeout: 2
    banner_timeout: 5
    command_timeout: 7
    ping_timeout: 1
    ping_count: 1
    max_targets: 0
  audit:
    read_only: true
    preload_phpipam_cache: true
    export_single_audit: true
    fail_fast: false
  compliance:
    radius: true
    ntp: true
    scheduler: true
    watchdog: true
    phpipam: true
  remediation:
    enabled: true
    allow_apply: false
    allow_generate_script: true
    allowed_domains:
      - ntp
      - watchdog
      - scheduler
    output_dir: logs/remediation
  report:
    output_xlsx: mikrotik_inventory.xlsx
    output_json: mikrotik_inventory.ndjson
    write_excel: true
    write_ndjson: true
    write_google_sheets: true

ntp:
  enabled: "yes"
  servers:
    - 10.216.8.10

clocks:
  enabled: "yes"
  timezone: Asia/Almaty
  summer_time_mode: none

scheduler:
  enabled: true
  expected:
    - name: reboot-night
      interval: 1d
      on_event: /system reboot
      policy: ftp,reboot,read,write,policy,test,password,sniff,sensitive,romon
      start_time_mode: staggered
      time_window_start: 02:00:00
      time_window_end: 04:00:00
      slot_minutes: 10
      seed_by: ip
      disabled: "no"

    - name: reboot-evening
      interval: 1d
      on_event: /system reboot
      policy: ftp,reboot,read,write,policy,test,password,sniff,sensitive,romon
      start_time_mode: staggered
      time_window_start: 18:00:00
      time_window_end: 20:00:00
      slot_minutes: 10
      seed_by: ip
      disabled: "no"

watchdog:
  automatic_supout: "no"
  ping_start_after_boot: 0ms
  ping_timeout: 10s
  watchdog_timer: "no"

